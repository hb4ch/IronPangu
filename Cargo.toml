[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
inferfabric-model = { path = "crates/inferfabric-model" }
inferfabric-dsl = { path = "crates/inferfabric-dsl" }
inferfabric-ir = { path = "crates/inferfabric-ir" }
inferfabric-compiler = { path = "crates/inferfabric-compiler" }
inferfabric-runtime = { path = "crates/inferfabric-runtime" }
inferfabric-transfer = { path = "crates/inferfabric-transfer" }
inferfabric-scheduler = { path = "crates/inferfabric-scheduler" }

inferfabric-plan = { path = "crates/inferfabric-plan" }

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
pangu-model = { path = "crates/pangu-model" }
pangu-dsl = { path = "crates/pangu-dsl" }
pangu-ir = { path = "crates/pangu-ir" }
pangu-compiler = { path = "crates/pangu-compiler" }
pangu-runtime = { path = "crates/pangu-runtime" }
pangu-transfer = { path = "crates/pangu-transfer" }
pangu-scheduler = { path = "crates/pangu-scheduler" }

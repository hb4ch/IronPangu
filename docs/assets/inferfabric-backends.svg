<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 718" role="img" aria-labelledby="title desc">
<title id="title">Whole-model planning and backend optimization</title><desc id="desc">Proposed design: InferFabric delegates computation regions to TileLang, PTO, Triton or Ascend C/ACLNN, then selects implementations and finalizes memory and scheduling. Generated backend routes are planned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#50667e"/></marker></defs>
<rect width="1200" height="718" rx="16" fill="#0c1625"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="42" fill="#70ead2" font-size="12" font-weight="600">TWO LEVELS OF OPTIMIZATION / PROPOSED DESIGN</text><text x="40" y="82" fill="#eef4fc" font-size="29" font-weight="600">Plan globally. Optimize each computation region locally.</text><rect x="310" y="115" width="580" height="130" rx="12" fill="#152638"/><rect x="310" y="133" width="3" height="24" rx="1.5" fill="#70ead2"/><text x="332" y="153" fill="#eef4fc" font-size="21" font-weight="600">InferFabric: semantic region + constraints</text><text x="332" y="187" fill="#a7bbcf" font-size="16" font-weight="400">Tensor operations, shapes, precision and effects</text><text x="332" y="213" fill="#a7bbcf" font-size="16" font-weight="400">Fusion candidates and external layout / resource contracts</text><path d="M600 245V267H170V292" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 245V267H455V292" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 245V267H740V292" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 245V267H1025V292" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="295" width="265" height="140" rx="12" fill="#152638"/><rect x="40" y="313" width="3" height="24" rx="1.5" fill="#96b5ff"/><text x="62" y="333" fill="#eef4fc" font-size="21" font-weight="600">TileLang-Ascend</text><text x="62" y="367" fill="#a7bbcf" font-size="16" font-weight="400">Parameterized tile program</text><text x="62" y="393" fill="#a7bbcf" font-size="16" font-weight="400">Passes + legal tuning space</text><rect x="325" y="295" width="265" height="140" rx="12" fill="#152638"/><rect x="325" y="313" width="3" height="24" rx="1.5" fill="#96b5ff"/><text x="347" y="333" fill="#eef4fc" font-size="21" font-weight="600">PTO</text><text x="347" y="367" fill="#a7bbcf" font-size="16" font-weight="400">Region-to-tile lowering</text><text x="347" y="393" fill="#a7bbcf" font-size="16" font-weight="400">Instructions + synchronization</text><rect x="610" y="295" width="265" height="140" rx="12" fill="#152638"/><rect x="610" y="313" width="3" height="24" rx="1.5" fill="#96b5ff"/><text x="632" y="333" fill="#eef4fc" font-size="21" font-weight="600">Triton-Ascend</text><text x="632" y="367" fill="#a7bbcf" font-size="16" font-weight="400">Region-to-kernel lowering</text><text x="632" y="393" fill="#a7bbcf" font-size="16" font-weight="400">Backend compilation</text><rect x="895" y="295" width="265" height="140" rx="12" fill="#152638"/><rect x="895" y="313" width="3" height="24" rx="1.5" fill="#96b5ff"/><text x="917" y="333" fill="#eef4fc" font-size="21" font-weight="600">Ascend C / ACLNN</text><text x="917" y="367" fill="#a7bbcf" font-size="16" font-weight="400">Generated / custom kernels</text><text x="917" y="393" fill="#a7bbcf" font-size="16" font-weight="400">Vendor implementation calls</text><path d="M170 435V463H600V487" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 435V463H600V487" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M740 435V463H600V487" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025 435V463H600V487" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="490" width="580" height="130" rx="12" fill="#152638"/><rect x="310" y="508" width="3" height="24" rx="1.5" fill="#70ead2"/><text x="332" y="528" fill="#eef4fc" font-size="21" font-weight="600">InferFabric: select, verify, finalize</text><text x="332" y="562" fill="#a7bbcf" font-size="16" font-weight="400">Compare kernels + conversions + communication cost</text><text x="332" y="588" fill="#a7bbcf" font-size="16" font-weight="400">Finalize global memory, schedule and native bundle</text><text x="40" y="657" fill="#a7bbcf" font-size="16" font-weight="400">Backends return compiled implementations, layouts, workspace bounds and qualification / cost evidence.</text><text x="40" y="687" fill="#a7bbcf" font-size="15" font-weight="400">TileLang receives computation structure before tiling is fixed. PTO is a sibling backend, not a required intermediate.</text></g></svg>
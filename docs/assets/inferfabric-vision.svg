<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" role="img" aria-labelledby="title desc">
<title id="title">InferFabric model-to-execution vision</title><desc id="desc">Target architecture. A model is optimized into a native bundle; the Rust frontend and scheduler drive qualified Ascend execution. General compilation and native bundles remain planned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#50667e"/></marker></defs>
<rect width="1200" height="644" rx="16" fill="#0c1625"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="42" fill="#70ead2" font-size="12" font-weight="600">THE GRAND IDEA / TARGET ARCHITECTURE</text><text x="40" y="82" fill="#eef4fc" font-size="30" font-weight="600">Turn a model into an inspectable execution program.</text><text x="40" y="121" fill="#a7bbcf" font-size="18" font-weight="400">Compilation resolves decisions; serving executes a qualified plan.</text><text x="40" y="170" fill="#96b5ff" font-size="12" font-weight="600">PLAN &amp; COMPILE</text><rect x="40" y="190" width="340" height="150" rx="12" fill="#152638"/><rect x="40" y="208" width="3" height="24" rx="1.5" fill="#70ead2"/><text x="62" y="228" fill="#eef4fc" font-size="21" font-weight="600">Describe the model</text><text x="62" y="262" fill="#a7bbcf" font-size="16" font-weight="400">Tensor math + explicit state</text><text x="62" y="288" fill="#a7bbcf" font-size="16" font-weight="400">Checkpoint bindings + constants</text><text x="62" y="314" fill="#a7bbcf" font-size="16" font-weight="400">Shapes + parallelism constraints</text><rect x="430" y="190" width="340" height="150" rx="12" fill="#152638"/><rect x="430" y="208" width="3" height="24" rx="1.5" fill="#70ead2"/><text x="452" y="228" fill="#eef4fc" font-size="21" font-weight="600">Optimize the whole graph</text><text x="452" y="262" fill="#a7bbcf" font-size="16" font-weight="400">Fusion + backend candidates</text><text x="452" y="288" fill="#a7bbcf" font-size="16" font-weight="400">Layouts + communication</text><text x="452" y="314" fill="#a7bbcf" font-size="16" font-weight="400">Schedule + memory lifetimes</text><rect x="820" y="190" width="340" height="150" rx="12" fill="#152638"/><rect x="820" y="208" width="3" height="24" rx="1.5" fill="#70ead2"/><text x="842" y="228" fill="#eef4fc" font-size="21" font-weight="600">Emit a native bundle</text><text x="842" y="262" fill="#a7bbcf" font-size="16" font-weight="400">Kernels + verified physical DAG</text><text x="842" y="288" fill="#a7bbcf" font-size="16" font-weight="400">Resource contracts + identities</text><text x="842" y="314" fill="#a7bbcf" font-size="16" font-weight="400">IR dumps + visual explanation</text><path d="M380 265H427" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 265H817" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="400" fill="#70ead2" font-size="12" font-weight="600">LOAD &amp; SERVE</text><rect x="40" y="420" width="340" height="145" rx="12" fill="#152638"/><rect x="40" y="438" width="3" height="24" rx="1.5" fill="#70ead2"/><text x="62" y="458" fill="#eef4fc" font-size="21" font-weight="600">vLLM Rust frontend</text><text x="62" y="492" fill="#a7bbcf" font-size="16" font-weight="400">Chat / completions + streaming</text><text x="62" y="518" fill="#a7bbcf" font-size="16" font-weight="400">Tokenization + cancellation</text><rect x="430" y="420" width="340" height="145" rx="12" fill="#152638"/><rect x="430" y="438" width="3" height="24" rx="1.5" fill="#70ead2"/><text x="452" y="458" fill="#eef4fc" font-size="21" font-weight="600">Schedule requests</text><text x="452" y="492" fill="#a7bbcf" font-size="16" font-weight="400">Admission + token budgets</text><text x="452" y="518" fill="#a7bbcf" font-size="16" font-weight="400">Bind tokens, positions and state</text><rect x="820" y="420" width="340" height="145" rx="12" fill="#152638"/><rect x="820" y="438" width="3" height="24" rx="1.5" fill="#70ead2"/><text x="842" y="458" fill="#eef4fc" font-size="21" font-weight="600">Execute on Ascend</text><text x="842" y="492" fill="#a7bbcf" font-size="16" font-weight="400">Load / prepare / capture</text><text x="842" y="518" fill="#a7bbcf" font-size="16" font-weight="400">Native kernels + graph replay</text><path d="M380 490H427" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 490H817" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)"/><path d="M990 340V417" fill="none" stroke="#50667e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="40" y="610" fill="#a7bbcf" font-size="15" font-weight="400">Current: native Qwen serving and graph replay. Planned: general v1 compiler, native bundles and generated backends.</text></g></svg>
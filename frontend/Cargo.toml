[package]
name = "pangu-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
tokio-util = "0.7"
vllm-server = { path = "../vendor/rust/src/server" }
vllm-llm = { path = "../vendor/rust/src/llm" }
vllm-engine-core-client = { path = "../vendor/rust/src/engine-core-client" }
pangu-model = { path = "../crates/pangu-model" }
pangu-dsl = { path = "../crates/pangu-dsl" }
pangu-ir = { path = "../crates/pangu-ir" }
pangu-compiler = { path = "../crates/pangu-compiler" }
pangu-scheduler = { path = "../crates/pangu-scheduler" }
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

pangu-native = { path = "../crates/pangu-native" }

rand = "0.9"

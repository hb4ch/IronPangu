[package]
name = "inferfabric-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
tokio-util = "0.7"
vllm-server = { path = "../vendor/rust/src/server" }
vllm-llm = { path = "../vendor/rust/src/llm" }
vllm-engine-core-client = { path = "../vendor/rust/src/engine-core-client" }
inferfabric-model = { path = "../crates/inferfabric-model" }
inferfabric-dsl = { path = "../crates/inferfabric-dsl" }
inferfabric-ir = { path = "../crates/inferfabric-ir" }
inferfabric-compiler = { path = "../crates/inferfabric-compiler" }
inferfabric-scheduler = { path = "../crates/inferfabric-scheduler" }
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

inferfabric-native = { path = "../crates/inferfabric-native" }

rand = "0.9"

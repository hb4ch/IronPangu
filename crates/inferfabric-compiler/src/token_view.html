<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>InferFabric execution plan</title>
  <style>
    :root {
      font:
        14px system-ui,
        sans-serif;
      color: #182938;
      background: #f5f7fa;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    header {
      background: #152c40;
      color: white;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 21px;
      margin: 0;
    }
    h2 {
      font-size: 18px;
    }
    small,
    .muted {
      color: #647588;
    }
    header small {
      color: #b6cedf;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid #c9d5df;
      border-radius: 5px;
      padding: 7px 11px;
      background: white;
      color: #164a70;
    }
    button:hover {
      background: #e9f3fb;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid #3886c5;
    }
    main {
      max-width: 1500px;
      margin: auto;
      padding: 22px;
    }
    .summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .summary > div {
      background: white;
      border: 1px solid #dce3e9;
      border-radius: 7px;
      padding: 12px 18px;
      min-width: 155px;
    }
    .summary strong {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }
    .notice {
      background: #fff8e4;
      border-left: 3px solid #c89730;
      padding: 12px 16px;
      margin: 16px 0;
      line-height: 1.6;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin: 18px 0;
    }
    input {
      padding: 9px;
      width: 310px;
      border: 1px solid #ccd6de;
      border-radius: 5px;
    }
    select {
      padding: 7px;
    }
    #crumbs {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }
    .table {
      overflow: auto;
      background: white;
      border: 1px solid #dce3e9;
      border-radius: 7px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    td,
    th {
      padding: 12px 14px;
      border-bottom: 1px solid #e7ecf1;
      vertical-align: top;
    }
    th {
      font-size: 12px;
      color: #52687a;
      background: #edf2f6;
    }
    td {
      font-size: 13px;
    }
    td small {
      display: block;
      margin-top: 5px;
      max-width: 430px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 3px 6px;
      border-radius: 4px;
      background: #edf1f6;
      font-size: 11px;
      margin: 2px;
    }
    .cast {
      background: #fff0d2;
      color: #895b00;
    }
    .comm {
      background: #e5edff;
      color: #2147a0;
    }
    .alias {
      background: #dbf2e6;
      color: #226645;
    }
    .name {
      border: 0;
      background: none;
      padding: 0;
      text-align: left;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    #detail {
      background: white;
      border: 1px solid #b8c9d8;
      border-radius: 8px;
      margin-top: 20px;
      padding: 22px;
      line-height: 1.6;
    }
    #detail:empty {
      display: none;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    code {
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    pre {
      white-space: pre-wrap;
      font-size: 12px;
      background: #f4f7fa;
      padding: 12px;
      max-height: 240px;
      overflow: auto;
    }
    .pager {
      display: flex;
      gap: 16px;
      align-items: center;
      margin: 15px 0;
    }
    a {
      color: #216599;
    }
    @media (max-width: 800px) {
      main {
        padding: 12px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      header {
        padding: 15px;
      }
      .summary > div {
        min-width: 130px;
      }
    }
  </style>
  <header>
    <div>
      <h1>Execution plan</h1>
      <small id="title"></small>
    </div>
    <label
      >Rank
      <select id="rank"></select
    ></label>
  </header>
  <main>
    <div class="summary" id="summary"></div>
    <div class="notice" id="parallel"></div>
    <div id="crumbs"></div>
    <div class="toolbar">
      <input
        id="search"
        aria-label="Search plan"
        placeholder="Search kernels, ops, weights or placement"
      /><select id="filter" aria-label="Filter instructions">
        <option value="all">All work</option>
        <option value="comm">Collectives / EP</option>
        <option value="cast">Casts</option>
        <option value="copy">Copies / materialization</option>
        <option value="kernel">Compute kernels</option></select
      ><button id="mode">Show instructions in this scope</button>
    </div>
    <div id="content"></div>
    <div id="detail"></div>
    <details>
      <summary>Plan limits and numerical policy</summary>
      <div id="limits"></div>
    </details>
  </main>
  <script type="application/json" id="plan-data">
    __PLAN_DATA__
  </script>
  <script>
    "use strict";
    const data = JSON.parse(document.querySelector("#plan-data").textContent),
      { graph, physical, program, recipes } = data;
    const $ = (s) => document.querySelector(s),
      esc = (x) =>
        String(x ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
    const ins = program.instructions,
      nodes = graph.nodes,
      root = {
        id: "root",
        label: graph.name,
        children: [],
        logical: [],
        parent: null,
      },
      groups = new Map([["root", root]]);
    nodes.forEach((n, id) => {
      let p = root;
      p.logical.push(id);
      const frames = n.source?.frames || [];
      frames.forEach((f, k) => {
        const key = JSON.stringify(
          frames.slice(0, k + 1).map((x) => [x.module, x.instance]),
        );
        let g = groups.get(key);
        if (!g) {
          g = {
            id: key,
            label: f.instance,
            module: f.module,
            children: [],
            logical: [],
            parent: p,
          };
          groups.set(key, g);
          p.children.push(g);
        }
        g.logical.push(id);
        p = g;
      });
    });
    let scope = root,
      page = 0,
      flat = false,
      rank = 0;
    const pageSize = 25;
    const isComm = (i) =>
      [
        "gather",
        "allreduce",
        "expert_linear",
        "expert_swiglu_down",
        "expert_reduce",
      ].includes(i.op);
    const idsFor = (g) => {
      const set = new Set(g.logical);
      return ins
        .map((i, id) => id)
        .filter((id) => set.has(ins[id].logical_node));
    };
    function matches(id) {
      const i = ins[id],
        r = recipes[id],
        q = $("#search").value.toLowerCase(),
        f = $("#filter").value;
      return (
        (!q ||
          JSON.stringify([i, nodes[i.logical_node], r])
            .toLowerCase()
            .includes(q)) &&
        (f === "all" ||
          (f === "comm" && isComm(i)) ||
          (f === "cast" && i.op === "cast") ||
          (f === "copy" &&
            (i.op === "copy" ||
              /copy|packing|concat|materializ|packed input|staging/i.test(
                r.materialization + " " + r.internal,
              ))) ||
          (f === "kernel" &&
            r.apis.length > 0 &&
            !["cast", "gather", "allreduce"].includes(i.op)))
      );
    }
    function go(g) {
      scope = g;
      page = 0;
      $("#detail").innerHTML = "";
      render();
    }
    function badge(t, kind = "") {
      return `<span class="badge ${kind}">${esc(t)}</span>`;
    }
    function placement(id) {
      const r = recipes[id];
      let s = r.placement;
      if (s === "ep_owner_local")
        s += ` · rank ${rank} owns experts ${rank * (data.parallel.expert_count / data.parallel.ep)}–${(rank + 1) * (data.parallel.expert_count / data.parallel.ep) - 1}`;
      if (s === "tp_local_heads") s += ` · rank ${rank}`;
      return s;
    }
    function memoryDetails(id) {
      const arena=data.arena?.ranks[rank];
      if(!arena) return "Preparation pool; no hardware-bound arena in this bundle. Vendor workspace and composite temporaries are prepared at runtime.";
      const slots=(arena.instruction_slots[String(id)] || []).map(j=>arena.slots[j]);
      return `Frozen arena: ${arena.bytes.toLocaleString()} bytes, ${arena.slots.length} slots on rank ${rank}. Growth is forbidden. Exact-size LIFO reuse on the owning stream; checkpoint storage is separate.<br>` +
        (slots.length ? `<table><thead><tr><th>Slot</th><th>Offset</th><th>Bytes</th></tr></thead><tbody>${slots.map(s=>`<tr><td>${s.id}</td><td>${s.offset}</td><td>${s.bytes}</td></tr>`).join("")}</tbody></table>` : "No new slot or workspace acquired by this instruction in the preparation trace; aliases may still read existing storage.");
    }
    function inspect(id) {
      const i = ins[id],
        n = nodes[i.logical_node],
        r = recipes[id];
      $("#detail").innerHTML =
        `<button id="close" style="float:right">Close</button><h2>#${id} ${esc(i.name)}</h2><div class="grid"><section><b>Selected implementation</b><p>${r.apis.length ? r.apis.map((x) => `<code>${esc(x)}</code>`).join(" → ") : esc(r.internal)}</p><p>${badge(r.granularity)} ${badge(i.dtype)} ${badge(placement(id))}</p><p>${esc(i.reason)}</p><b>Internal work / numerical contract</b><p>${esc(r.internal)}</p><b>Storage / aliasing</b><p>${esc(r.materialization)}</p><b>Communication</b><p>${esc(r.communication)}</p></section><section><b>Shape</b><p>${i.kind === 0 ? `[${i.width}] ${esc(i.dtype)} · ${i.width * (i.dtype === "bf16" ? 2 : 4)} payload bytes per rank` : i.kind === 5 ? `[${i.width}] INT8 payload + [1] FP32 scale · ${i.width + 4} payload bytes per rank` : "Opaque structured value; inner shapes belong to backend recipe"}</p><b>Dependencies</b><p>${i.inputs.length ? i.inputs.map((j) => `<button data-ins="${j}">#${j} ${esc(ins[j].name)} · ${esc(ins[j].dtype)}</button>`).join(" ") : "Control / parameters only"}</p><b>Weight bindings and attributes</b><pre>${esc(JSON.stringify(n.attrs, null, 2))}</pre><b>Scheduling / memory</b><p>Rank ${rank}, owning stream 0; SSA last-use release. ${memoryDetails(id)} Cost unknown; no measured candidate comparison.</p></section></div>`;
      $("#close").onclick = () => ($("#detail").innerHTML = "");
      $("#detail")
        .querySelectorAll("[data-ins]")
        .forEach((b) => (b.onclick = () => inspect(+b.dataset.ins)));
      $("#detail").scrollIntoView({ block: "nearest" });
    }
    function render() {
      const ids = idsFor(scope).filter(matches),
        query = $("#search").value || $("#filter").value !== "all",
        showInstructions = flat || query || !scope.children.length;
      let chain = [];
      for (let p = scope; p; p = p.parent) chain.unshift(p);
      $("#crumbs").innerHTML = chain
        .map((g, k) => `<button data-crumb="${k}">${esc(g.label)}</button>`)
        .join(" / ");
      $("#crumbs")
        .querySelectorAll("button")
        .forEach((b) => (b.onclick = () => go(chain[+b.dataset.crumb])));
      $("#mode").textContent = flat
        ? "Show modules"
        : "Show instructions in this scope";
      const rows = showInstructions ? ids : scope.children;
      page = Math.min(page, Math.max(0, Math.ceil(rows.length / pageSize) - 1));
      let body = rows
        .slice(page * pageSize, (page + 1) * pageSize)
        .map((item) => {
          if (!showInstructions) {
            const g = item,
              all = idsFor(g),
              cs = all.filter((j) => ins[j].op === "cast").length,
              comm = all.filter((j) =>
                ["allreduce", "gather"].includes(ins[j].op),
              ).length,
              ks = [...new Set(all.flatMap((j) => recipes[j].apis))];
            return `<tr><td><button class="name" data-scope="${esc(g.id)}">▸ ${esc(g.label)}</button><small>${esc(g.module)}</small></td><td>${all.length} instructions</td><td>${badge(cs + " casts", "cast")} ${badge(comm + " collectives", "comm")}</td><td>${ks.slice(0, 4).map(esc).join("<br>")}<small>${ks.length > 4 ? "+" + (ks.length - 4) + " other APIs" : ""}</small></td></tr>`;
          }
          const id = item,
            i = ins[id],
            r = recipes[id];
          return `<tr><td><button class="name" data-ins="${id}">#${id} ${esc(i.name)}</button><small>${esc(i.op)} · ${esc(r.granularity)}</small></td><td>${r.apis.map((x) => `<code>${esc(x)}</code>`).join("<br>") || esc(r.internal)}<small>${esc(r.internal)}</small></td><td>${badge(i.kind === 5 ? "int8 + f32 scale" : i.dtype, i.op === "cast" ? "cast" : "")}${i.kind === 0 ? `<small>[${i.width}] per rank</small>` : ""}<small>${esc(r.materialization)}</small></td><td>${badge(placement(id))}<small>${esc(r.communication)}</small></td></tr>`;
        })
        .join("");
      $("#content").innerHTML =
        `<p class="muted">${showInstructions ? ids.length + " instructions in selected scope. Click a row for bindings and dependencies." : "Expand a module to inspect its execution. No full-model node dump."}</p><div class="table"><table><thead><tr>${(showInstructions ? ["Instruction", "Selected API / recipe", "Precision & storage", "Sharding & communication"] : ["Module", "Work", "Conversions / comm", "Kernel APIs"]).map((x) => "<th>" + x + "</th>").join("")}</tr></thead><tbody>${body || '<tr><td colspan="4">No matching work</td></tr>'}</tbody></table></div><div class="pager"><button id="prev" ${page === 0 ? "disabled" : ""}>Previous</button><span>${rows.length ? `${page * pageSize + 1}–${Math.min(rows.length, (page + 1) * pageSize)} of ${rows.length}` : "0"}</span><button id="next" ${(page + 1) * pageSize >= rows.length ? "disabled" : ""}>Next</button></div>`;
      $("#content")
        .querySelectorAll("[data-scope]")
        .forEach((b) => (b.onclick = () => go(groups.get(b.dataset.scope))));
      $("#content")
        .querySelectorAll("[data-ins]")
        .forEach((b) => (b.onclick = () => inspect(+b.dataset.ins)));
      $("#prev").onclick = () => {
        page--;
        render();
      };
      $("#next").onclick = () => {
        page++;
        render();
      };
    }
    $("#title").textContent = graph.name + " · " + program.format;
    $("#rank").innerHTML = physical.ranks
      .map(
        (r, i) =>
          `<option value="${i}">${r.rank} · device ${r.device}</option>`,
      )
      .join("");
    $("#rank").onchange = (e) => {
      rank = +e.target.value;
      $("#detail").innerHTML = "";
      render();
    };
    const casts = ins.filter((i) => i.op === "cast").length,
      comm = ins.filter((i) => ["allreduce", "gather"].includes(i.op)).length;
    $("#summary").innerHTML = [
      [ins.length, "Executable instructions"],
      [casts, "Explicit boundary casts"],
      [comm, "Model collectives"],
      [program.conversions_shared, "Conversions shared"],
      [program.copies_eliminated, "Copies eliminated"],
    ]
      .map(([v, t]) => `<div><strong>${v}</strong>${t}</div>`)
      .join("");
    $("#parallel").innerHTML =
      `<b>Ascend token backend · TP ${data.parallel.tp} / EP ${data.parallel.ep}</b><br>EP method: ${esc(data.parallel.method)}. ${data.parallel.unsupported.map(esc).join(" and ")} are <b>not selected or implemented by this backend</b>. ${esc(data.parallel.transport)}. Activations stay on device.<br><small>Per-rank weights use the DSL placement: tp_rows, tp_columns, tp_channels, replicated or expert ownership. Model collectives exclude the request-output token-consensus AllGather.</small>`;
    $("#limits").innerHTML =
      program.limitations.map((s) => "<p>" + esc(s) + "</p>").join("") +
      "<p>Boundary casts, dense quantization and MLA query construction are executable rows. Remaining composite internals are listed in their details. Bound arena slots are measured during hardware preparation; no fabricated kernel costs or timings.</p>";
    $("#mode").onclick = () => {
      flat = !flat;
      page = 0;
      render();
    };
    $("#search").oninput = $("#filter").onchange = () => {
      page = 0;
      render();
    };
    render();
    window.planInspector = {
      data,
      groups,
      go,
      inspect,
      get scope() {
        return scope;
      },
    };
  </script>
</html>
